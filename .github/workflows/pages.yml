# ============================================================================
# PowerGIS — Deploy WebAssembly Application & Grid Portal to GitHub Pages
# Hosts: https://sv007git.github.io/PowerGIS/
# ============================================================================
name: Deploy PowerGIS Web to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin" trunk
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build WebAssembly App with Trunk
        run: |
          set -euo pipefail
          cd apps/powergis-web
          trunk build --release --public-url ./

      - name: Generate Service Worker
        run: |
          cargo xtask web-pwa dist/web

      - name: Bundle Grid Intelligence Portal & Documentation
        run: |
          set -euo pipefail
          mkdir -p dist/web/portal
          cp -r web/* dist/web/portal/
          touch dist/web/.nojekyll

      - name: Publish to gh-pages Branch
        run: |
          set -euo pipefail
          cd dist/web
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy PowerGIS WebAssembly App & Grid Portal [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/web'

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
