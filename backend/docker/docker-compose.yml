version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS 3.4
  powergis-db:
    image: postgis/postgis:16-3.4
    container_name: powergis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powergis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PowerGIS@2026}
      POSTGRES_DB: ${POSTGRES_DB:-powergis}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powergis -d powergis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis for caching & rate limiting
  powergis-redis:
    image: redis:7-alpine
    container_name: powergis-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. FastAPI Python Backend
  powergis-api:
    build:
      context: ../..
      dockerfile: backend/docker/Dockerfile
    container_name: powergis-backend
    restart: always
    depends_on:
      powergis-db:
        condition: service_healthy
      powergis-redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-powergis}:${POSTGRES_PASSWORD:-PowerGIS@2026}@powergis-db:5432/${POSTGRES_DB:-powergis}
      SECRET_KEY: ${SECRET_KEY:-powergis-super-secure-production-jwt-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"

  # 4. Nginx Reverse Proxy
  powergis-proxy:
    image: nginx:alpine
    container_name: powergis-nginx
    restart: always
    depends_on:
      - powergis-api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:
