# ============================================================================
# PowerGIS — In-House Production Server Deployment (Docker Compose)
# Runs:
#   1. PostgreSQL 16 with PostGIS 3.4 (Database & Spatial Engine)
#   2. PostgREST (Auto-generated REST API matching Supabase endpoints)
#   3. pgAdmin 4 (Web-based GIS database administration)
# ============================================================================
version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: powergis_inhouse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: powergis
      POSTGRES_USER: powergis_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PowerGIS2026SecurePass!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - powergis_db_data:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/99_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powergis_admin -d powergis"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: powergis_inhouse_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://powergis_admin:${DB_PASSWORD:-PowerGIS2026SecurePass!}@db:5432/powergis
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: powergis_admin
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports:
      - "${API_PORT:-3000}:3000"

  pgadmin:
    image: dpage/pgadmin4:8.10
    container_name: powergis_inhouse_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@powergis.gov.in}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-PowerGISAdmin2026!}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  powergis_db_data:
  pgadmin_data:
