  <script>
    // The service worker (sw.js, written by `cargo xtask web-pwa` for deployed builds) lets the app
    // start offline. A new deploy waits until the user reloads from the notice, so the page never
    // changes under them. The notebook widget (?embed) runs without one.
    (function () {
      if (!("serviceWorker" in navigator) || new URLSearchParams(location.search).has("embed")) return;
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          var note = document.getElementById("powergis_update");
          var updating = false;
          function offer(worker) {
            // No controller means this is the first install, not an update.
            if (!worker || !navigator.serviceWorker.controller) return;
            note.querySelector(".reload").onclick = function () {
              updating = true;
              worker.postMessage({ type: "powergis-update" });
            };
            note.querySelector(".dismiss").onclick = function () { note.hidden = true; };
            note.hidden = false;
          }
          offer(reg.waiting);
          reg.addEventListener("updatefound", function () {
            var worker = reg.installing;
            if (worker) worker.addEventListener("statechange", function () { if (worker.state === "installed") offer(worker); });
          });
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (updating) location.reload();
          });
          // An installed app can stay open for days: look for a new deploy when it comes back into view.
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") reg.update().catch(function () {});
          });
        }).catch(function () {});
      });
    })();
  </script>
